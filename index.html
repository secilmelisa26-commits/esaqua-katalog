<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Esaqua Petshop - Canlı Kataloğu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #333; }
    
    header { background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff; text-align: center; padding: 25px 15px; }
    header h1 { font-size: 26px; margin-bottom: 5px; letter-spacing: 1px; color: #f8fafc; }
    header p { font-size: 14px; color: #94a3b8; }

    .container { max-width: 1000px; margin: 0 auto; padding: 15px; }

    /* Arama ve Navigasyon Barı */
    .search-box { margin-bottom: 20px; text-align: center; }
    .search-box input { width: 100%; max-width: 500px; padding: 12px 18px; border: 2px solid #cbd5e1; border-radius: 25px; font-size: 15px; outline: none; transition: 0.3s; }
    .search-box input:focus { border-color: #0284c7; box-shadow: 0 0 8px rgba(2, 132, 199, 0.3); }

    .breadcrumb { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; background: #fff; padding: 10px 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .back-btn { background: #0284c7; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
    .back-btn:hover { background: #0369a1; }
    .section-title { font-size: 18px; font-weight: 600; color: #1e293b; }

    /* Izgara Yapısı (Grid) */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    @media (min-width: 600px) {
      .grid-container { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    }

    /* Kategori & Ürün Kart Tasarımları */
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0,0,0,0.12); }
    .card img { width: 100%; height: 140px; object-fit: cover; background-color: #e2e8f0; }
    .card-body { padding: 12px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
    .card-title { font-size: 15px; font-weight: 600; color: #0f172a; margin-bottom: 4px; }
    .card-subtitle { font-size: 12px; color: #64748b; }
    .card-price { font-size: 16px; font-weight: bold; color: #16a34a; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>Esaqua Petshop</h1>
    <p>Canlı Akvaryum Balıkları ve Bitki Kataloğu</p>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Balık türü veya ürün adı ara..." onkeyup="searchItems()">
    </div>

    <div class="breadcrumb">
      <span class="section-title" id="pageTitle">Kategoriler</span>
      <button class="back-btn" id="backBtn" onclick="showCategories()">← Tüm Kategoriler</button>
    </div>

    <!-- Fotoğraflı Kutucukların Görüneceği Alan -->
    <div class="grid-container" id="mainGrid"></div>
  </div>

  <script>
    // Veri Tabanı (Görseller Unsplash'ten canlı balık fotoğraflarıyla ayarlandı)
    const catalogData = [
      {
        id: "lepistes",
        name: "Lepistes & Canlı Doğuranlar",
        image: "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?auto=format&fit=crop&w=500&q=80",
        items: [
          { name: "Special Lepistes Çeşitleri", price: "75 TL", image: "https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?auto=format&fit=crop&w=500&q=80" },
          { name: "Full Red Lepistes", price: "90 TL", image: "https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=500&q=80" },
          { name: "Plati Çeşitleri", price: "45 TL", image: "https://images.unsplash.com/photo-1520301255226-bf5f144451c1?auto=format&fit=crop&w=500&q=80" }
        ]
      },
      {
        id: "cuce-ciklet",
        name: "Cüce Cikletler & Apistogramma",
        image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=500&q=80",
        items: [
          { name: "Apistogramma Panduro (Pandurini)", price: "220 TL", image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=500&q=80" },
          { name: "Apistogramma Cacatuoides", price: "200 TL", image: "https://images.unsplash.com/photo-1524704654690-b56c05c78a00?auto=format&fit=crop&w=500&q=80" },
          { name: "German Blue Ramirezi", price: "150 TL", image: "https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=500&q=80" }
        ]
      },
      {
        id: "tetra",
        name: "Tetra & Sürü Balıkları",
        image: "https://images.unsplash.com/photo-1524704654690-b56c05c78a00?auto=format&fit=crop&w=500&q=80",
        items: [
          { name: "Kırmızı Burun Tetra", price: "35 TL", image: "https://images.unsplash.com/photo-1524704654690-b56c05c78a00?auto=format&fit=crop&w=500&q=80" },
          { name: "Neon Tetra", price: "30 TL", image: "https://images.unsplash.com/photo-1520301255226-bf5f144451c1?auto=format&fit=crop&w=500&q=80" }
        ]
      },
      {
        id: "ciklet",
        name: "Ciklet Türleri",
        image: "https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=500&q=80",
        items: [
          { name: "Sarı Prenses", price: "60 TL", image: "https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=500&q=80" },
          { name: "Yunus Ciklet", price: "70 TL", image: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=500&q=80" }
        ]
      }
    ];

    const mainGrid = document.getElementById("mainGrid");
    const pageTitle = document.getElementById("pageTitle");
    const backBtn = document.getElementById("backBtn");

    // Ana Ekran: Kategorileri Görsel Kutucuk Olarak Göster
    function showCategories() {
      pageTitle.innerText = "Kategoriler";
      backBtn.style.display = "none";
      mainGrid.innerHTML = "";

      catalogData.forEach(cat => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => showProducts(cat.id);
        card.innerHTML = `
          <img src="${cat.image}" alt="${cat.name}">
          <div class="card-body">
            <div class="card-title">${cat.name}</div>
            <div class="card-subtitle">${cat.items.length} Çeşit Balık</div>
          </div>
        `;
        mainGrid.appendChild(card);
      });
    }

    // Kategoriye Tıklandığında: Balık Fotoğraflarını ve Fiyatlarını Göster
    function showProducts(catId) {
      const category = catalogData.find(c => c.id === catId);
      if (!category) return;

      pageTitle.innerText = category.name;
      backBtn.style.display = "block";
      mainGrid.innerHTML = "";

      category.items.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <div class="card-body">
            <div class="card-title">${item.name}</div>
            <div class="card-price">${item.price}</div>
          </div>
        `;
        mainGrid.appendChild(card);
      });
    }

    // Arama Fonksiyonu
    function searchItems() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      if (!query) {
        showCategories();
        return;
      }

      pageTitle.innerText = "Arama Sonuçları";
      backBtn.style.display = "block";
      mainGrid.innerHTML = "";

      catalogData.forEach(cat => {
        cat.items.forEach(item => {
          if (item.name.toLowerCase().includes(query)) {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <img src="${item.image}" alt="${item.name}">
              <div class="card-body">
                <div class="card-title">${item.name}</div>
                <div class="card-subtitle">${cat.name}</div>
                <div class="card-price">${item.price}</div>
              </div>
            `;
            mainGrid.appendChild(card);
          }
        });
      });
    }

    // İlk açılışta kategorileri yükle
    showCategories();
  </script>
</body>
</html>
