<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Esaqua Petshop - Akvaryum Canlıları Kataloğu</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 50px; }

        header {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
        }
        header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        header p { color: #94a3b8; font-size: 0.95rem; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

        /* Üst Arama ve Yönetici Butonu */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.5rem 0;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box { flex: 1; min-width: 240px; }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box input:focus { border-color: var(--primary); }

        .admin-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .admin-btn:hover { background-color: #0f172a; }

        /* KATEGORİ BUTONLARI (HER ZAMAN ÜSTTE GÖRÜNÜR) */
        .categories-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.75rem;
            margin-bottom: 2rem;
            white-space: nowrap;
        }
        .cat-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* BALIK LİSTESİ GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .product-category {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #059669;
        }

        /* GİZLİ PENCERELER (MODAL) */
        .modal {
            display: none; /* Varsayılan olarak gizli! */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-modal {
            position: absolute;
            right: 1rem; top: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.85rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.65rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;
        }

        .btn-submit {
            background: #059669; color: white; border: none; padding: 0.75rem; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer;
        }

        .admin-item {
            display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); font-size: 0.9rem;
        }
        .btn-del { background: #dc2626; color: white; border: none; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1>Esaqua Petshop</h1>
            <p>Akvaryum Canlıları & Ürün Kataloğu</p>
        </div>
    </header>

    <main class="container">
        <!-- ARAMA VE YÖNETİCİ GİRİŞİ -->
        <div class="top-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Balık veya ürün ara..." oninput="renderProducts()">
            </div>
            <button class="admin-btn" onclick="openLoginModal()">🔒 Yönetici Girişi</button>
        </div>

        <!-- 1. KATEGORİ BUTONLARI (SAYFAYA GİRER GİRMEZ ÇIKAN KISIM) -->
        <div class="categories-scroll" id="categoryButtons">
            <button class="cat-btn active" onclick="setCategory('Tümü')">Tümü</button>
