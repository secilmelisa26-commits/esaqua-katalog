<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esaqua Petshop - Ürün Kataloğu</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .filter-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
        .filter-btn { width: auto; padding: 8px 16px; background-color: #e0e0e0; border: none; cursor: pointer; border-radius: 20px; }
        .filter-btn.active { background-color: #007bff; color: white; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .product-card { border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px; text-align: center; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <h2>Esaqua Petshop - Yeni Ürün Ekle</h2>
    
    <!-- ÜRÜN EKLEME FORMU -->
    <form id="productForm">
        <div class="form-group">
            <label for="fishName">Balık / Ürün Adı</label>
            <input type="text" id="fishName" placeholder="Örn: Celebes Rainbow / Cüce Gurami" required>
        </div>

        <div class="form-group">
            <label for="fishCategory">Kategori Seçin</label>
            <select id="fishCategory" required>
                <option value="canli-doguran">Lepistes & Canlı Doğuran Türleri</option>
                <option value="cuce-ciklet">Cüce Ciklet Türleri</option>
                <option value="tetra-suru">Tetra & Sürü Balıkları</option>
                <option value="ciklet">Ciklet Türleri (Oscar vb.)</option>
                <option value="dip-baliklari">Vatoz, Çöpçü & Dip Balıkları</option>
                
                <!-- DÜZELTİLEN YENİ KATEGORİ -->
                <option value="karma-baliklar">Diğer Renkli & Karma Balıklar</option>
                
                <option value="japon">Japon Balıkları</option>
                <option value="omurgasizlar">Omurgasızlar (Salyangoz, Karides vb.)</option>
                <option value="betalar">Betalar</option>
                <option value="bitki-malzeme">Bitki & Akvaryum Malzemeleri</option>
            </select>
        </div>

        <button type="submit" style="background-color: #28a745; color: white; font-weight: bold;">Ürünü Kataloğa Ekle</button>
    </form>

    <hr style="margin: 30px 0;">

    <h2>Katalog & Kategoriler</h2>

    <!-- FİLTRELEME BUTONLARI -->
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterCategory('all')">Tümü</button>
        <button class="filter-btn" onclick="filterCategory('canli-doguran')">Canlı Doğuranlar</button>
        <button class="filter-btn" onclick="filterCategory('cuce-ciklet')">Cüce Cikletler</button>
        <button class="filter-btn" onclick="filterCategory('tetra-suru')">Tetra & Sürü</button>
        <button class="filter-btn" onclick="filterCategory('ciklet')">Cikletler</button>
        <button class="filter-btn" onclick="filterCategory('dip-baliklari')">Dip Balıkları</button>
        
        <!-- YENİ KATEGORİ FİLTRE BUTONU -->
        <button class="filter-btn" onclick="filterCategory('karma-baliklar')">Diğer Renkli & Karma</button>
        
        <button class="filter-btn" onclick="filterCategory('japon')">Japon Balıkları</button>
        <button class="filter-btn" onclick="filterCategory('omurgasizlar')">Omurgasızlar</button>
        <button class="filter-btn" onclick="filterCategory('betalar')">Betalar</button>
        <button class="filter-btn" onclick="filterCategory('bitki-malzeme')">Bitki & Malzeme</button>
    </div>

    <!-- ÜRÜNLERİN LİSTELENDİĞİ ALAN -->
    <div id="productGrid" class="product-grid">
        <!-- Eklenen balıklar dinamik olarak buraya gelecek -->
    </div>
</div>

<!-- JAVASCRIPT KODLARI -->
<script>
    const products = [];

    // Form Gönderildiğinde Ürünü Kaydet
    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('fishName').value;
        const category = document.getElementById('fishCategory').value;

        // Yeni Ürün Objesi
        const newProduct = { name, category };
        products.push(newProduct);

        // Formu temizle ve listeyi yenile
        document.getElementById('fishName').value = '';
        renderProducts('all');
    });

    // Ürünleri Ekrana Basma Fonksiyonu
    function renderProducts(filter = 'all') {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';

        const filteredProducts = filter === 'all' 
            ? products 
            : products.filter(p => p.category === filter);

        if (filteredProducts.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; color: #777;">Bu kategoride henüz ürün bulunmuyor.</p>';
            return;
        }

        filteredProducts.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <h3>${product.name}</h3>
                <small style="color: #666;">Kategori Kodu: ${product.category}</small>
            `;
            grid.appendChild(card);
        });
    }

    // Butonla Filtreleme Fonksiyonu
    function filterCategory(categoryKey) {
        // Aktif buton görünümünü değiştir
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Ürünleri filtrele
        renderProducts(categoryKey);
    }
</script>

</body>
</html>
